<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/retro.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Math Arcade</title>
</head>
<body>
<main class="screen center">
  <h1 class="title">MATH<br>ARCADE</h1>
  <p class="subtitle blink">INSERT COIN TO PLAY</p>
  <form id="login" class="panel login">
    <p>Enter your username and PIN</p>
    <label>Username
      <input id="login-name" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label><span id="login-secret-label">PIN</span>
      <input id="login-secret" type="password" inputmode="numeric" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Press start</button>
    <button id="guest-start" class="btn small ghost" type="button" hidden>Play as guest</button>
    <p id="signin-note" class="note" role="status"></p>
  </form>
  <p class="fine">Your teacher gave you a username and PIN. Your answers and scores are saved under your username so your teacher can see how you're doing. Nothing else about you is saved. Guest games aren't saved at all.</p>
</main>
<script type="module" src="js/signin.js"></script>
</body>
</html>
